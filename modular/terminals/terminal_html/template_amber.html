:root {
  --crt-red: rgb(218, 49, 49);
  --crt-green: rgb(112, 159, 115);
  --crt-blue: rgb(40, 129, 206);
}
/* Global */
html {
  font-size: 14px;

  min-height: 100%;
  h1 {font-size: 21px; margin: 15px 0px 5px;}
  h2 {font-size: 15px; margin: 15px 0px 5px;}
  li {margin: 2px 0px 2px 15px;}
  ul {margin: 5px; padding: 0px;}
  ol {margin: 5px; padding: 0px 15px;}
body {font-size: 14px; font-family: "Courier", Courier, monospace; bgcolor:'#0d0405';}
}
main {
  height: 100vh;
  height: 100dvh;
  color: rgb(209, 158, 18);
}

.pink {
  color: pink;
}
.yellow {
  color: yellow;
}
.lightblue {
  color: lightblue;
}
.code {
  color: attr(data-color);
}
.wrapper {
  padding-top: 2rem;
  padding-left: 1rem;
  display: inline-block;
  white-space: nowrap;
}
.code {
  animation: typewriter 1s steps(14) 1s 1 normal both;
  line-height: 1;
  margin: 0;
  display: inline-block;
  white-space: nowrap;
  overflow-x: hidden;
}
.cursor {
  display: inline-block;
  animation: blinkTextCursor 500ms infinite normal;
}

/* Animation */
.anim-typewriter {
}
@keyframes typewriter {
  from {
    width: 0;
  }
  to {
    width: 100%;
  }
}
@keyframes blinkTextCursor {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.crt {
  background-color: rgb(30, 28, 25);
  text-shadow: 0 0 0.2em currentColor, 1px 1px rgba(255, 0, 255, 0.5),
    -1px -1px rgba(0, 255, 255, 0.4);
  position: relative;
  &:before,
  &:after {
    content: "";
    transform: translateZ(0);
    pointer-events: none;
    //opacity: 0.5;
    mix-blend-mode: overlay;
    position: absolute;
    height: 100%;
    width: 100%;
    left: 0;
    top: 0;
    z-index: 1;
  }

  &:before {
    background: repeating-linear-gradient(
      var(--crt-red) 1px,
      var(--crt-green) 2px,
      var(--crt-blue) 4x
    );
  }
  &:after {
    background: repeating-linear-gradient(
      90deg,
      var(--crt-red) 1px,
      var(--crt-green) 2px,
      var(--crt-blue) 3px
    );
  }
}
</style>
